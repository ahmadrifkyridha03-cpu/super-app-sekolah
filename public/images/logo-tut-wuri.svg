<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="twhGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE59" />
      <stop offset="50%" stop-color="#FFBD59" />
      <stop offset="100%" stop-color="#DE9800" />
    </linearGradient>
    <linearGradient id="twhBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066B3" />
      <stop offset="100%" stop-color="#004080" />
    </linearGradient>
    <filter id="twhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Pentagonal Crest (Segi Lima Lambang Tut Wuri Handayani) -->
  <polygon points="250,22 472,183 387,445 113,445 28,183" 
           fill="url(#twhBlue)" 
           stroke="url(#twhGold)" 
           stroke-width="12" 
           stroke-linejoin="round"
           filter="url(#twhGlow)" />

  <polygon points="250,38 456,188 377,431 123,431 44,188" 
           fill="none" 
           stroke="#FFFFFF" 
           stroke-width="3" 
           stroke-linejoin="round" />

  <!-- Stylized Education Wings (Sayap Kiri dan Kanan) -->
  <!-- Left Wing -->
  <g fill="url(#twhGold)" stroke="#003366" stroke-width="1.5">
    <path d="M 230,220 C 180,180 110,195 80,240 C 110,245 150,235 180,250 C 140,255 100,270 95,300 C 120,295 160,280 190,295 C 150,310 120,335 125,360 C 150,350 185,335 220,335 Z" />
  </g>

  <!-- Right Wing -->
  <g fill="url(#twhGold)" stroke="#003366" stroke-width="1.5">
    <path d="M 270,220 C 320,180 390,195 420,240 C 390,245 350,235 320,250 C 360,255 400,270 405,300 C 380,295 340,280 310,295 C 350,310 380,335 375,360 C 350,350 315,335 280,335 Z" />
  </g>

  <!-- Belencong Lamp / Api Abadi (Flame & Torch) -->
  <!-- Blazing 5 Flame Rays (Kuncup Api) -->
  <path d="M 250,95 
           C 256,120 275,135 268,160 
           C 285,140 280,115 270,105 
           C 280,125 288,145 282,175 
           C 265,190 235,190 218,175 
           C 212,145 220,125 230,105 
           C 220,115 215,140 232,160 
           C 225,135 244,120 250,95 Z" 
        fill="url(#twhGold)" 
        stroke="#B8860B" 
        stroke-width="2" />

  <!-- Inner Torch Core -->
  <path d="M 250,115 C 255,135 262,150 258,168 C 250,172 242,168 242,155 C 242,140 248,130 250,115 Z" 
        fill="#FF3B30" />

  <!-- Belencong Lamp Base -->
  <path d="M 235,178 L 265,178 L 272,210 L 228,210 Z" 
        fill="url(#twhGold)" 
        stroke="#805300" 
        stroke-width="2" />
  <ellipse cx="250" cy="210" rx="22" ry="6" fill="#FFDE59" stroke="#805300" stroke-width="2" />

  <!-- Open Book of Wisdom (Buku Putih) -->
  <!-- Left Page -->
  <path d="M 250,295 C 215,275 165,275 135,285 L 135,345 C 165,335 215,335 250,355 Z" 
        fill="#FFFFFF" 
        stroke="#002D62" 
        stroke-width="4" />
  <!-- Left Lines -->
  <line x1="150" y1="298" x2="235" y2="310" stroke="#005BAC" stroke-width="2.5" stroke-linecap="round" />
  <line x1="150" y1="312" x2="235" y2="324" stroke="#005BAC" stroke-width="2.5" stroke-linecap="round" />
  <line x1="150" y1="326" x2="225" y2="338" stroke="#005BAC" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Page -->
  <path d="M 250,295 C 285,275 335,275 365,285 L 365,345 C 335,335 285,335 250,355 Z" 
        fill="#FFFFFF" 
        stroke="#002D62" 
        stroke-width="4" />
  <!-- Right Lines -->
  <line x1="265" y1="310" x2="350" y2="298" stroke="#005BAC" stroke-width="2.5" stroke-linecap="round" />
  <line x1="265" y1="324" x2="350" y2="312" stroke="#005BAC" stroke-width="2.5" stroke-linecap="round" />
  <line x1="275" y1="338" x2="350" y2="326" stroke="#005BAC" stroke-width="2.5" stroke-linecap="round" />

  <!-- Book Spine Center -->
  <path d="M 248,295 L 252,295 L 252,357 L 248,357 Z" fill="url(#twhGold)" />

  <!-- Golden Banner / Pita Semboyan -->
  <g transform="translate(0, 10)">
    <path d="M 105,395 
             C 180,380 320,380 395,395 
             L 415,425 L 380,418 
             C 310,405 190,405 120,418 
             L 85,425 Z" 
          fill="url(#twhGold)" 
          stroke="#805300" 
          stroke-width="3" 
          filter="url(#twhGlow)" />

    <!-- Text TUT WURI HANDAYANI -->
    <path id="pitaArc" fill="none" d="M 115,413 Q 250,392 385,413" />
    <text fill="#002D62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="19" font-weight="900" letter-spacing="4">
      <textPath href="#pitaArc" startOffset="50%" text-anchor="middle">
        TUT WURI HANDAYANI
      </textPath>
    </text>
  </g>
</svg>
